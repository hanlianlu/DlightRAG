# Optional LightRAG graph browser overlay.
#
# The GUI is upstream LightRAG-server: it cannot read DlightRAG's config.yaml,
# so this file bridges the two worlds. Everything derives from .env except the
# two LIGHTRAG_GUI_LLM_* values, whose defaults only exist so the GUI can boot.
#
# Start it with:
#   docker compose -f docker-compose.yml -f docker-compose.gui.yml --profile gui up -d

services:
  lightrag-gui:
    profiles: [gui]
    restart: unless-stopped
    image: dlightrag:local
    build:
      context: .
    ports:
      - "127.0.0.1:9621:9621"
    environment:
      # PostgreSQL — same instance as DlightRAG (read-only, no conflict)
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DLIGHTRAG_STORAGE__POSTGRES__USER:-dlightrag}
      POSTGRES_PASSWORD: ${DLIGHTRAG_STORAGE__POSTGRES__PASSWORD:-dlightrag}
      POSTGRES_DATABASE: ${DLIGHTRAG_STORAGE__POSTGRES__DATABASE:-dlightrag}
      # Storage backends — must match DlightRAG exactly
      LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      # Workspace — same as DlightRAG to see the same graph
      WORKSPACE: ${DLIGHTRAG_DEPLOYMENT__WORKSPACE:-default}
      # LLM — initialization only; graph browsing never calls it.
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LIGHTRAG_GUI_LLM_HOST:-https://openrouter.ai/api/v1}
      LLM_BINDING_API_KEY: ${DLIGHTRAG_MODELS__CHAT__DEFAULT__API_KEY}
      LLM_MODEL: ${LIGHTRAG_GUI_LLM_MODEL:-google/gemini-3.7-flash}
      # Embedding — must match DlightRAG's vector columns or vectors decode wrong.
      EMBEDDING_BINDING: ${LIGHTRAG_GUI_EMBEDDING_BINDING:-voyageai}
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_GUI_EMBEDDING_HOST:-https://api.voyageai.com/v1}
      EMBEDDING_BINDING_API_KEY: ${DLIGHTRAG_MODELS__EMBEDDING__API_KEY:-}
      EMBEDDING_MODEL: ${LIGHTRAG_GUI_EMBEDDING_MODEL:-voyage-multimodal-3.5}
      EMBEDDING_DIM: "${LIGHTRAG_GUI_EMBEDDING_DIM:-1024}"
      # Server
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: /tmp/lightrag_gui
      INPUT_DIR: /tmp/lightrag_gui/inputs
      LOG_DIR: /tmp
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["lightrag-server"]
