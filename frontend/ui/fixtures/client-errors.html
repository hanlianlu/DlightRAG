<!doctype html>
<meta charset="utf-8">
<title>Client error reporting fixture</title>
<script>
  // The page the reporter runs in: a stand-in server that records each report,
  // and a way for a test to raise an error or a rejection here.
  window.reports = [];
  window.respond = () => new Response(null, {status: 204});
  window.fetch = async (url, init) => { reports.push({url, ...init}); return respond(); };
  addEventListener('raise', (event) => { throw event.detail; });
  addEventListener('reject', (event) => { Promise.reject(event.detail); });
</script>
<script type="module">
  import {reportUncaughtErrors} from '/api/client-errors.ts';
  reportUncaughtErrors();
</script>
