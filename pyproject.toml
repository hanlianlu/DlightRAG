[project]
name = "dlightrag"
version = "1.9.0"
description = "Multimodal RAG with knowledge graph and contextual intelligence"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    # Workspace cores
    "dlightrag-ai[all]==1.9.0",
    "dlightrag-agent-core==1.9.0",
    "dlightrag-rag-core==1.9.0",
    # Core RAG
    "lightrag-hku>=1.5.6",
    # PostgreSQL
    "asyncpg>=0.31.0",
    "numpy>=2.3.0",
    "pgvector>=0.5.0",
    # Config
    "pydantic>=2.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    # Utils
    "httpx>=0.28.0",
    "pillow>=12.3.0",
    # Request-local lexical retrieval for Web Composer documents.
    "bm25s>=0.3.10",
    # LightRAG paragraph_semantic chunker fallback
    "langchain-text-splitters",
    # lightrag-server runtime dep when lightrag-hku is installed without the api extra.
    "bcrypt",
    "aiofiles",
    # MCP server
    "mcp>=2.0.0",
    # REST API server
    "PyJWT>=2.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.22",
    # Web frontend
    "jinja2>=3.1",
    "markdown-it-py[plugins]>=3.0",
    "nh3>=0.2",
    "pygments>=2.17",
    # Observability
    "langfuse>=4.14.3",
    # Native docx parsing: lightrag's docx parser imports python-docx + defusedxml.
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    # Direct-text charset detection for answer resource reads.
    "charset-normalizer>=3.4.0",
    # Deterministic binary answer-resource readers (selected extras only).
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.4",
    "pypdfium2>=4.30.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
eval = [
    "lightrag-hku[evaluation]>=1.5.6",
]
dev = [
    "import-linter>=2.11",
    "pre-commit>=4.6.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.8.0",
    "questionary>=2",
    "rich>=13",
    "ruamel.yaml>=0.18",
    "ruff>=0.16.2",
    "shellcheck-py>=0.10",
]

[project.urls]
Homepage = "https://github.com/hanlianlu/dlightrag"
Repository = "https://github.com/hanlianlu/dlightrag"
Issues = "https://github.com/hanlianlu/dlightrag/issues"

[project.scripts]
dlightrag-mcp = "dlightrag.mcp.cli:main"
dlightrag-api = "dlightrag.api.server:main"
dlightrag-rebuild-bm25 = "dlightrag.maintenance.rebuild_bm25:main"
dlightrag-rebuild-vdb = "dlightrag.maintenance.rebuild_vdb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/ai", "packages/agent-core", "packages/rag-core"]

[tool.uv.sources]
dlightrag-ai = { workspace = true }
dlightrag-agent-core = { workspace = true }
dlightrag-rag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag"]
# Built by Vite and gitignored, so hatchling would otherwise leave the UI out.
artifacts = ["src/dlightrag/web/static/generated/**"]

[tool.hatch.build.targets.sdist]
include = ["src/dlightrag", "README.md", "LICENSE", "NOTICE"]
artifacts = ["src/dlightrag/web/static/generated/**"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: Playwright-driven end-to-end UI tests",
    "integration: requires running PostgreSQL",
    "e2e_pg18: opt-in PostgreSQL 18 + LightRAG smoke tests",
]

[tool.importlinter]
root_packages = ["dlightrag", "dlightrag_ai", "dlightrag_agent", "dlightrag_rag"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "ai-package-independence"
name = "AI must remain provider-neutral and root-independent"
type = "forbidden"
source_modules = ["dlightrag_ai"]
forbidden_modules = [
    "dlightrag",
    "dlightrag_agent",
    "dlightrag_rag",
    "lightrag",
    "asyncpg",
    "fastapi",
    "mcp",
]

[[tool.importlinter.contracts]]
id = "agent-package-independence"
name = "Agent core may depend on AI but not product or RAG"
type = "forbidden"
source_modules = ["dlightrag_agent"]
forbidden_modules = [
    "dlightrag",
    "dlightrag_rag",
    "lightrag",
    "asyncpg",
    "fastapi",
    "mcp",
]

[[tool.importlinter.contracts]]
id = "rag-package-independence"
name = "RAG core must remain storage-neutral and product-independent"
type = "forbidden"
source_modules = ["dlightrag_rag"]
forbidden_modules = [
    "dlightrag",
    "dlightrag_agent",
    "asyncpg",
    "fastapi",
    "mcp",
]

[[tool.importlinter.contracts]]
id = "no-transport-internals"
name = "Internal packages must not import from transport layers"
type = "forbidden"
source_modules = [
    "dlightrag.config",
    "dlightrag.model_settings",
    "dlightrag.utils",
    "dlightrag.prompts",
    "dlightrag.citations",
    "dlightrag.application",
    "dlightrag.observability",
    "dlightrag.maintenance",
]
forbidden_modules = [
    "dlightrag.web",
    "dlightrag.api",
    "dlightrag.mcp",
]

[[tool.importlinter.contracts]]
id = "core-no-api-or-mcp"
name = "Core modules do not directly import API or MCP transports"
type = "forbidden"
source_modules = ["dlightrag.core"]
forbidden_modules = ["dlightrag.api", "dlightrag.mcp"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "core-domain-no-web"
name = "Core domain modules do not directly assemble Web"
type = "forbidden"
source_modules = [
    "dlightrag.core.access",
    "dlightrag.core.agent",
    "dlightrag.core.answer",
    "dlightrag.core.answer_runs",
    "dlightrag.core.client_attachments",
    "dlightrag.core.client_contracts",
    "dlightrag.core.client_execution",
    "dlightrag.core.client_payloads",
    "dlightrag.core.client_requests",
    "dlightrag.core.contract_guard",
    "dlightrag.core.federation",
    "dlightrag.core.ingest_job_coordinator",
    "dlightrag.core.lightrag_lifecycle",
    "dlightrag.core.memory",
    "dlightrag.core.principal",
    "dlightrag.core.request",
    "dlightrag.core.reset",
    "dlightrag.core.resources",
    "dlightrag.core.retrieval",
    "dlightrag.core.scope",
    "dlightrag.core.service",
    "dlightrag.core.source_download",
    "dlightrag.core.tools",
    "dlightrag.core.visual_assets",
]
forbidden_modules = ["dlightrag.web"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "postgres-adapter-owner-direction"
name = "PostgreSQL adapters may implement owners but never import API or MCP"
type = "forbidden"
source_modules = ["dlightrag.adapters.postgres"]
forbidden_modules = ["dlightrag.api", "dlightrag.mcp"]

[[tool.importlinter.contracts]]
id = "runtime-independence"
name = "Durable runtime must remain storage and product-policy neutral"
type = "forbidden"
source_modules = ["dlightrag.runtime"]
forbidden_modules = [
    "dlightrag.core",
    "dlightrag.adapters.postgres",
    "dlightrag.api",
    "dlightrag.mcp",
    "dlightrag.web",
    "dlightrag_rag",
    "asyncpg",
    "fastapi",
    "mcp",
]

[[tool.importlinter.contracts]]
id = "application-health-independence"
name = "Application health must remain composition and adapter neutral"
type = "forbidden"
source_modules = ["dlightrag.application"]
forbidden_modules = [
    "dlightrag.core",
    "dlightrag.adapters.postgres",
    "dlightrag.api",
    "dlightrag.mcp",
    "dlightrag.web",
    "dlightrag_rag",
    "asyncpg",
    "fastapi",
    "mcp",
]

[[tool.importlinter.contracts]]
id = "status-route-health-only"
name = "Status routes consume application health, not implementations"
type = "forbidden"
source_modules = ["dlightrag.api.routes.status"]
forbidden_modules = [
    "dlightrag.core.answer",
    "dlightrag.core.servicemanager",
    "dlightrag.adapters.postgres",
]

[[tool.importlinter.contracts]]
id = "no-circular-foundation"
name = "Foundation packages must not import from domain"
type = "forbidden"
source_modules = [
    "dlightrag.config",
    "dlightrag.utils",
    "dlightrag.prompts",
]
forbidden_modules = [
    "dlightrag.model_settings",
    "dlightrag.core",
    "dlightrag.adapters.postgres",
    "dlightrag.observability",
    "dlightrag.citations",
]

[[tool.importlinter.contracts]]
id = "transport-postgres-adapter-direction"
name = "Transport owners do not import PostgreSQL implementations directly"
type = "forbidden"
source_modules = [
    "dlightrag.api",
    "dlightrag.web",
    "dlightrag.mcp",
]
forbidden_modules = ["dlightrag.adapters.postgres"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "foundation-layers"
name = "Foundation packages follow the documented layering"
type = "layers"
layers = [
    "dlightrag.model_settings",
    "dlightrag.config",
    "dlightrag.observability",
    "dlightrag.prompts | dlightrag.utils",
]

[[tool.importlinter.contracts]]
id = "core-coordination-layers"
name = "Core coordination stack is layered"
type = "layers"
containers = ["dlightrag.core"]
layers = [
    "servicemanager",
    "service",
    "reset",
]

[[tool.importlinter.contracts]]
id = "resources-below-tools"
name = "The resource domain must not import the tool package"
type = "forbidden"
source_modules = ["dlightrag.core.resources"]
forbidden_modules = ["dlightrag.core.tools"]

[[tool.importlinter.contracts]]
id = "tools-below-agent"
name = "Tools are composed per run, never by importing the orchestrator"
type = "forbidden"
source_modules = ["dlightrag.core.tools"]
forbidden_modules = [
    "dlightrag.core.agent",
    "dlightrag.core.answer_runs",
    "dlightrag.maintenance",
]
