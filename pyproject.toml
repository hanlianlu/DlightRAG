[project]
name = "dlightrag"
version = "3.0.0"
description = "Multimodal RAG with knowledge graph and contextual intelligence"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    # Standalone workspace package
    "dlightrag-memory==3.0.0",
    # Built-in model providers (batteries included)
    "openai>=2.54.0",
    "anthropic>=1.0.0",
    "google-genai>=2.19.0",
    "json-repair>=0.62.0",
    # Built-in RAG and source capabilities
    "lightrag-hku>=1.5.6",
    "aiofiles>=24.1.0",
    "aiobotocore>=3.9.0",
    "azure-storage-blob>=12.28.0",
    "botocore>=1.43.3",
    "lingua-language-detector>=2.2.0",
    # PostgreSQL
    "asyncpg>=0.31.0",
    "numpy>=2.5.0",
    "pgvector>=0.5.0",
    # Config
    "pydantic>=2.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    # Utils
    "httpx>=0.28.1",
    "pathspec>=1.0.4",
    "pillow>=12.3.0",
    "tiktoken>=0.14.0",
    # Request-local lexical retrieval for Web Composer documents.
    "bm25s>=0.3.10",
    # LightRAG paragraph_semantic chunker fallback
    "langchain-text-splitters",
    # lightrag-server runtime dep when lightrag-hku is installed without the api extra.
    "bcrypt",
    # MCP server
    "mcp>=2.0.0",
    # REST API server
    "PyJWT>=2.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.22",
    # Web frontend
    "markdown-it-py[plugins]>=3.0",
    "nh3>=0.3.7",
    "pygments>=2.17",
    # Observability
    "langfuse>=4.14.3",
    # Native docx parsing: lightrag's docx parser imports python-docx + defusedxml.
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    # Direct-text charset detection for answer resource reads.
    "charset-normalizer>=3.4.0",
    # Deterministic binary answer-resource readers (selected extras only).
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.7",
    "pypdfium2>=5.13.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
eval = [
    "lightrag-hku[evaluation]>=1.5.6",
]
dev = [
    "bandit>=1.9.4",
    "import-linter>=2.11",
    "pre-commit>=4.6.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.8.0",
    "questionary>=2",
    "rich>=13",
    "ruamel.yaml>=0.18",
    "ruff>=0.16.2",
    "shellcheck-py>=0.10",
]

[project.urls]
Homepage = "https://github.com/hanlianlu/dlightrag"
Repository = "https://github.com/hanlianlu/dlightrag"
Issues = "https://github.com/hanlianlu/dlightrag/issues"

[project.scripts]
dlightrag-mcp = "dlightrag.mcp.cli:main"
dlightrag-api = "dlightrag.api.server:main"
dlightrag-rebuild-bm25 = "dlightrag.maintenance.rebuild_bm25:main"
dlightrag-rebuild-vdb = "dlightrag.maintenance.rebuild_vdb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/memory"]

[tool.uv.sources]
dlightrag-memory = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag"]
# Built by Vite and gitignored, so hatchling would otherwise leave the UI out.
artifacts = ["src/dlightrag/web/static/app/**"]

[tool.hatch.build.targets.sdist]
include = ["src/dlightrag", "README.md", "LICENSE", "NOTICE"]
artifacts = ["src/dlightrag/web/static/app/**"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: Playwright-driven end-to-end UI tests",
    "integration: requires running PostgreSQL",
    "e2e_pg18: opt-in PostgreSQL 18 + LightRAG smoke tests",
]

[tool.importlinter]
root_packages = ["dlightrag", "dlightrag_memory"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "memory-package-independence"
name = "Memory package stays host-neutral"
type = "forbidden"
source_modules = ["dlightrag_memory"]
forbidden_modules = ["dlightrag", "lightrag", "fastapi"]

[[tool.importlinter.contracts]]
id = "ai-module-independence"
name = "AI remains provider-neutral and independent of product modules"
type = "forbidden"
source_modules = ["dlightrag.ai"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.agent", "dlightrag.answer", "dlightrag.api", "dlightrag.maintenance", "dlightrag.mcp", "dlightrag.observability", "dlightrag.rag", "dlightrag.runtime", "dlightrag.sdk", "dlightrag.web", "dlightrag_memory", "lightrag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "agent-module-independence"
name = "Agent may depend on AI but not product or RAG modules"
type = "forbidden"
source_modules = ["dlightrag.agent"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.answer", "dlightrag.api", "dlightrag.maintenance", "dlightrag.mcp", "dlightrag.observability", "dlightrag.rag", "dlightrag.runtime", "dlightrag.sdk", "dlightrag.web", "dlightrag_memory", "lightrag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "rag-module-independence"
name = "RAG remains storage-neutral and independent of product modules"
type = "forbidden"
source_modules = ["dlightrag.rag"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.agent", "dlightrag.answer", "dlightrag.api", "dlightrag.maintenance", "dlightrag.mcp", "dlightrag.observability", "dlightrag.runtime", "dlightrag.sdk", "dlightrag.web", "dlightrag_memory", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "no-transport-internals"
name = "Internal packages must not import transport layers"
type = "forbidden"
source_modules = ["dlightrag.answer", "dlightrag.application", "dlightrag.observability", "dlightrag.maintenance"]
forbidden_modules = ["dlightrag.web", "dlightrag.api", "dlightrag.mcp"]

[[tool.importlinter.contracts]]
id = "transport-corpus-implementation-direction"
name = "Transports depend on Application Corpus Administration"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dlightrag.api", "dlightrag.mcp", "dlightrag.web"]
forbidden_modules = ["dlightrag.rag.pool", "dlightrag.rag.ports", "dlightrag.rag.ingestion", "dlightrag.rag.source_download", "dlightrag.rag.federation", "dlightrag.rag.lightrag_models", "dlightrag.rag.lightrag_stores", "dlightrag.rag.rerank", "dlightrag.rag.reset", "dlightrag.rag.settings", "dlightrag.rag.visual_assets", "dlightrag.rag.workspace_rag"]

[[tool.importlinter.contracts]]
id = "answer-independence"
name = "Answer execution has no access, adapter, or transport dependencies"
type = "forbidden"
source_modules = ["dlightrag.answer"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.adapters.postgres", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "access-independence"
name = "Access owns identity and authorization only"
type = "forbidden"
source_modules = ["dlightrag.application.access"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.config", "dlightrag.application.corpus_admin", "dlightrag.application.memory", "dlightrag.application.retrieval", "dlightrag.application.settings", "dlightrag.application.web_conversations", "dlightrag.adapters", "dlightrag.answer", "dlightrag.api", "dlightrag.mcp", "dlightrag.rag", "dlightrag.web", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "sdk-independence"
name = "SDK owns HTTP client behavior"
type = "forbidden"
source_modules = ["dlightrag.sdk"]
forbidden_modules = ["dlightrag.adapters.postgres", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "dlightrag.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "retrieval-service-independence"
name = "Application Retrieval owns inline retrieval"
type = "forbidden"
source_modules = ["dlightrag.application.retrieval"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "answer-service-independence"
name = "Application Answer Runs owns durable run acceptance"
type = "forbidden"
source_modules = ["dlightrag.application.answer_runs"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "postgres-adapter-owner-direction"
name = "PostgreSQL adapters never import API or MCP"
type = "forbidden"
source_modules = ["dlightrag.adapters.postgres"]
forbidden_modules = ["dlightrag.api", "dlightrag.mcp"]

[[tool.importlinter.contracts]]
id = "runtime-independence"
name = "Durable runtime remains storage and product-policy neutral"
type = "forbidden"
source_modules = ["dlightrag.runtime"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters.postgres", "dlightrag.answer", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "dlightrag.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "corpus-admin-independence"
name = "Corpus Administration remains composition and adapter neutral"
type = "forbidden"
source_modules = ["dlightrag.application.corpus_admin"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "dlightrag.answer", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "application-no-adapters-or-inbound-transports"
name = "Application does not compose or import adapters and transports"
type = "forbidden"
source_modules = ["dlightrag.application"]
forbidden_modules = ["dlightrag._compose", "dlightrag.adapters", "dlightrag.api", "dlightrag.mcp", "dlightrag.web"]

[[tool.importlinter.contracts]]
id = "application-health-independence"
name = "Application health remains composition and adapter neutral"
type = "forbidden"
source_modules = ["dlightrag.application.health"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.corpus_admin", "dlightrag.application.retrieval", "dlightrag.adapters", "dlightrag.api", "dlightrag.mcp", "dlightrag.web", "dlightrag.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "status-route-health-only"
name = "Status routes consume Application health"
type = "forbidden"
source_modules = ["dlightrag.api.routes.status"]
forbidden_modules = ["dlightrag.answer", "dlightrag.adapters.postgres"]

[[tool.importlinter.contracts]]
id = "no-circular-foundation"
name = "Configuration does not import projections, Answer, PostgreSQL, or Observability"
type = "forbidden"
source_modules = ["dlightrag.application.config"]
forbidden_modules = ["dlightrag.application.settings", "dlightrag.application.answer_runs", "dlightrag.adapters.postgres", "dlightrag.observability", "dlightrag.answer"]

[[tool.importlinter.contracts]]
id = "transport-postgres-adapter-direction"
name = "Transport owners do not import PostgreSQL implementations"
type = "forbidden"
source_modules = ["dlightrag.api", "dlightrag.web", "dlightrag.mcp"]
forbidden_modules = ["dlightrag.adapters.postgres"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "foundation-layers"
name = "Application settings project Application configuration"
type = "layers"
layers = ["dlightrag.application.settings", "dlightrag.application.config", "dlightrag.observability"]

[[tool.importlinter.contracts]]
id = "resources-below-tools"
name = "The resource domain must not import the tool package"
type = "forbidden"
source_modules = ["dlightrag.answer.resources"]
forbidden_modules = ["dlightrag.answer.tools"]

[[tool.importlinter.contracts]]
id = "tools-below-agent"
name = "Tools are composed per run, never by importing the orchestrator"
type = "forbidden"
source_modules = ["dlightrag.answer.tools"]
forbidden_modules = ["dlightrag.answer.agent", "dlightrag.answer.runs", "dlightrag.maintenance"]
