# Credentials come from .env (not tracked in git).
#
# Optional parser profile (the default uses host-native MinerU):
#   docker compose --profile docling up -d  # bundled CPU Docling alternative

x-common-env: &common-env
  # Container-topology binding only: Compose service discovery differs from a
  # native run. Application behavior comes from config.yaml, credentials from
  # .env, and filesystem paths use the image's canonical application defaults.
  DLIGHTRAG_STORAGE__POSTGRES__HOST: postgres
x-global-skills-mount: &global-skills-mount
  type: bind
  source: ${COMPOSE_GLOBAL_SKILLS_DIR:-${HOME}/.dlightrag/skills}
  target: /home/app/.dlightrag/skills
  read_only: true
  bind:
    # Never let Docker create an operator-managed host directory as root.
    create_host_path: false
x-app-image: &app-image dlightrag:local
x-app-build: &app-build
  context: .

services:
  dlightrag-api:
    restart: unless-stopped
    image: *app-image
    build: *app-build
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      <<: *common-env
      # The container binds 0.0.0.0, but the port above is published to
      # 127.0.0.1 only, so no-auth is acceptable for local dev. Set
      # access.auth_mode: simple in config.yaml, provide
      # DLIGHTRAG_ACCESS__API_TOKEN as a Secret, and drop this override before
      # publishing the port on a non-loopback address.
      DLIGHTRAG_INTERFACES__API__HOST: "0.0.0.0"
      DLIGHTRAG_ACCESS__ALLOW_INSECURE_NO_AUTH: "true"
    env_file: .env
    configs:
      - source: dlightrag_config
        target: /app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dlightrag_data:/app/dlightrag_storage
      - dlightrag_agent_workspaces:/home/app/.dlightrag/agent_workspaces
      # Operator-provisioned global Skills; read-only for every user's Agent.
      - *global-skills-mount
      # Per-owner Agent Skills, written only through the validated
      # publish_skill/delete_skill tools. Persisted across container
      # recreations; multi-host deployments must share this path.
      - dlightrag_owner_skills:/home/app/.dlightrag/owner_skills
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=3); response.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dlightrag-mcp:
    restart: unless-stopped
    image: *app-image
    build: *app-build
    # SECURITY: MCP streamable-http exposes ingest / delete_files / answer.
    # This maps the host port to 127.0.0.1 only; set access.auth_mode: simple in
    # config.yaml and provide DLIGHTRAG_ACCESS__API_TOKEN as a Secret before
    # exposing it on a non-loopback network.
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      <<: *common-env
      DLIGHTRAG_INTERFACES__MCP__TRANSPORT: streamable-http
      DLIGHTRAG_INTERFACES__MCP__HOST: "0.0.0.0"
      DLIGHTRAG_INTERFACES__MCP__PORT: "8101"
      DLIGHTRAG_ACCESS__ALLOW_INSECURE_NO_AUTH: "true"
    env_file: .env
    configs:
      - source: dlightrag_config
        target: /app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dlightrag_data:/app/dlightrag_storage
      - dlightrag_agent_workspaces:/home/app/.dlightrag/agent_workspaces
      # Operator-provisioned global Skills; read-only for every user's Agent.
      - *global-skills-mount
      # Per-owner Agent Skills, written only through the validated
      # publish_skill/delete_skill tools. Persisted across container
      # recreations; multi-host deployments must share this path.
      - dlightrag_owner_skills:/home/app/.dlightrag/owner_skills
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dlightrag-mcp"]

  postgres:
    restart: unless-stopped
    image: dlightrag-postgres:pg18
    build:
      context: postgres
    shm_size: ${DLIGHTRAG_POSTGRES_SHM_SIZE:-8gb}
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DLIGHTRAG_STORAGE__POSTGRES__DATABASE:-dlightrag}
      POSTGRES_USER: ${DLIGHTRAG_STORAGE__POSTGRES__USER:-dlightrag}
      POSTGRES_PASSWORD: ${DLIGHTRAG_STORAGE__POSTGRES__PASSWORD:-dlightrag}
    volumes:
      - pg18_data:/var/lib/postgresql
    command:
      - "postgres"
      # pg_textsearch and pg_jieba require preloading
      - "-c"
      - "shared_preload_libraries=pg_textsearch,pg_jieba"
      # Memory
      - "-c"
      - "shared_buffers=${DLIGHTRAG_POSTGRES_SHARED_BUFFERS:-8GB}"
      - "-c"
      - "work_mem=${DLIGHTRAG_POSTGRES_WORK_MEM:-256MB}"
      - "-c"
      - "maintenance_work_mem=${DLIGHTRAG_POSTGRES_MAINTENANCE_WORK_MEM:-2GB}"
      - "-c"
      - "effective_cache_size=${DLIGHTRAG_POSTGRES_EFFECTIVE_CACHE_SIZE:-18GB}"
      # SSD / IO
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      # WAL
      - "-c"
      - "wal_buffers=16MB"
      # Parallelism
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      # Connections
      - "-c"
      - "max_connections=${DLIGHTRAG_POSTGRES_MAX_CONNECTIONS:-80}"
      # Disable JIT (no benefit for vector/JSONB workloads, saves compilation overhead)
      - "-c"
      - "jit=off"
      # Docker
      - "-c"
      - "huge_pages=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DLIGHTRAG_STORAGE__POSTGRES__USER:-dlightrag} -d ${DLIGHTRAG_STORAGE__POSTGRES__DATABASE:-dlightrag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  docling:
    profiles: [docling]
    image: ${DOCLING_SERVE_IMAGE:-quay.io/docling-project/docling-serve-cpu:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      # Upstream would keep working a stuck document for 7 days; DlightRAG stops
      # polling after 1440 x 5s, so past that the worker is held for nobody.
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "7200"
      # The two default workers each load their own copy of the models.
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      # Upstream defaults to WARNING, which says nothing about a slow parse.
      DOCLING_SERVE_LOG_LEVEL: INFO
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

configs:
  dlightrag_config:
    file: ./config.yaml

volumes:
  dlightrag_data:
  dlightrag_agent_workspaces:
  dlightrag_owner_skills:
  pg18_data:
