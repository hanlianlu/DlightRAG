<header class="report-head">
  <h1>2023 年分地区销售看板</h1>
  <p class="lede">全年销售额 7,904 万元、利润 1,492 万元（利润率 18.9%）；华东与华南合计占 58.6%，西南体量最小，但逐季增长。</p>
  <p class="meta">2023 年第一至第四季度 · 来源：内部销售数据</p>
</header>

<div class="slicer" data-slicer="metric" data-type="metric" data-label="指标"
     data-options='[{"label":"销售额","y":"revenue"},{"label":"利润","y":"profit"}]'></div>

<main>

    <figure class="chart wide" data-chart="trend"></figure>
    <figure class="chart" data-chart="product"></figure>
    <figure class="chart" data-chart="mix"></figure>
  </div>

  <h2>各地区全年合计</h2>
  <table>
    <thead><tr><th>地区</th><th class="num">销售额（万元）</th><th class="num">利润（万元）</th><th class="num">利润率</th></tr></thead>
    <tbody>
      <tr><td>华东</td><td class="num">2,376</td><td class="num">471</td><td class="num">19.8%</td></tr>
      <tr><td>华北</td><td class="num">2,054</td><td class="num">367</td><td class="num">17.9%</td></tr>
      <tr><td>华南</td><td class="num">2,252</td><td class="num">454</td><td class="num">20.2%</td></tr>
      <tr><td>西南</td><td class="num">1,222</td><td class="num">200</td><td class="num">16.4%</td></tr>
      <tr><td><b>合计</b></td><td class="num"><b>7,904</b></td><td class="num"><b>1,492</b></td><td class="num"><b>18.9%</b></td></tr>
    </tbody>
  </table>
  <div class="callout" data-kind="note">
    <p>图表随上方的地区与指标联动；表格是各地区的全年合计，不随筛选变化。</p>
  </div>
</main>

<script type="application/json" id="chart-trend">

  "option": {
    "title": {"text": "季度{metric}", "subtext": "单位：万元 · 来源：内部销售数据"},

    "xAxis": {"type": "category"},
