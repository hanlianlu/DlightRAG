# DlightRAG 2.0 canonical configuration
# Priority: env > .env > config.yaml > defaults

models:
  chat:
    default:
      provider: openai
      api_family: response
      model: z-ai/glm-5.3-flash
      base_url: https://openrouter.ai/api/v1
      temperature: 1.0
      reasoning: max
    roles:
      # DeepSeek rejects the json_schema response_format type, so every role on
      # it declares json_object explicitly. This is endpoint-specific, not the
      # shipped default: other endpoints keep the `auto` (strict schema) path.
      extract:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
      keyword:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
      query:
        provider: openai
        api_family: response
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.7
        reasoning: off
        # Agentic turns (tool loops) still think, but a measured 35k-token first
        # turn at ~200 tok/s cost minutes before the first tool call. high keeps
        # the loop responsive; raise deliberately, not by default.
        agentic_reasoning: high
        structured_output: json_object
      vlm:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
  embedding:
    provider: voyage
    model: voyage-multimodal-3.5
    base_url: https://api.voyageai.com/v1
    dim: 1024
    input_modality: auto
    max_concurrency: 16
    batch_size: 64
  rerank:
    enabled: true
    strategy: voyage_reranker
    model: rerank-2.5-lite
    input_modality: auto
    max_concurrency: 16

deployment:
  # Relative to the process working directory. In the bundled image this
  # resolves to /app/dlightrag_storage, matching the Compose volume target.
  working_dir: ./dlightrag_storage
  # Default logical Corpus Workspace, not a Docker or Agent Workspace path.
  workspace: default

corpus:
  sidecars:
    mineru:
      api_mode: local
      local_endpoint: http://host.docker.internal:8210
      language: ch
      backend: hybrid-engine
    # Docling alternative: remove or comment out the MinerU block above before
    # uncommenting this block; configure exactly one ingestion parser.
    # docling:
    #   endpoint: http://host.docker.internal:5001
    #   code_formula_preset: granite_docling
    # For the bundled CPU profile, use endpoint http://docling:5001 and set
    # code_formula_preset to null instead.
  ingestion:
    pipeline:
      max_concurrency: 16
  retrieval:
    top_k: 40
    chunk_top_k: 20
    direct_visual_top_k: 20

runtime:
  query:
    worker_concurrency: 16
    max_nonterminal_runs: 30000
  # Validated bounded defaults; see docs/run-runtime-and-scaling-target.md.
  corpus_mutation:
    worker_concurrency: 2
    max_nonterminal_runs: 1000
  run_retention_days: 365

answer:
  generation:
    max_images: 12
    max_attachments: 6
    max_attachment_bytes: 104857600
    max_total_attachment_bytes: 134217728
  agent:
    # disabled | trust. Trust confines every Agent process to its Agent Workspace.
    execution_environment: trust
    # Durable Agent memory: the notes one Agent Session keeps, independent of any
    # Run's workspace quota. A note that does not fit is refused for that note alone
    # (never truncated, never evicted) and stays in the writing Run's own copy.
    session_notes:
      max_count: 64
      max_bytes: 262144
    # Personal Settings Connections (Streamable HTTP only). Policy only narrows
    # owner grants; keys belong exclusively in the existing secret source. Timeouts
    # and size ceilings keep their documented defaults (personal-mcp-connections.md).
    connections:
      require_https: true
      allow_private_hosts: []
      max_connections: 20
      max_enabled_tools: 256

access:
  # The development default. A deployment sets its own access in .env (see
  # .env.example), keeping its issuer, audience, and people out of the
  # repository. Compose only carries the explicit local-loopback container
  # waiver required by its 0.0.0.0 listener binding.
  auth_mode: none

observability:
  langfuse_host: http://host.docker.internal:3300
