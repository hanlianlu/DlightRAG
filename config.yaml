# DlightRAG 3.0 canonical configuration
# Priority: env > .env > config.yaml > defaults

models:
  chat:
    default:
      provider: openai
      model: z-ai/glm-5.3-flash
      base_url: https://openrouter.ai/api/v1
      structured_output: json_schema
      temperature: 1.0
      model_kwargs:
        reasoning:
          enabled: false
      agentic_model_kwargs:
        reasoning:
          enabled: true
    roles:
      extract:
        provider: openai
        model: deepseek-v4-flash
        base_url: https://api.deepseek.com
        structured_output: json_object
        temperature: 0.0
        model_kwargs:
          thinking:
            type: disabled
      keyword:
        provider: openai
        model: deepseek-v4-flash
        base_url: https://api.deepseek.com
        structured_output: json_object
        temperature: 0.0
        model_kwargs:
          thinking:
            type: disabled
      query:
        provider: openai
        model: deepseek-v4-flash-vision-exp
        base_url: https://api.deepseek.com
        structured_output: json_schema
        temperature: 0.7
        model_kwargs:
          reasoning:
            enabled: false
        agentic_model_kwargs:
          reasoning:
            enabled: true
      vlm:
        provider: openai
        model: z-ai/glm-5.3-flash
        base_url: https://openrouter.ai/api/v1
        structured_output: json_schema
        temperature: 0.0
        model_kwargs:
          reasoning:
            enabled: false
  embedding:
    provider: voyage
    model: voyage-multimodal-3.5
    base_url: https://api.voyageai.com/v1
    dim: 1024
    input_modality: auto
    max_concurrency: 16
    batch_size: 64
  rerank:
    enabled: true
    strategy: voyage_reranker
    model: rerank-2.5-lite
    input_modality: auto
    max_concurrency: 16

deployment:
  working_dir: ./dlightrag_storage
  workspace: default

corpus:
  extraction:
    language: English
  sidecars:
    docling:
      endpoint: http://host.docker.internal:5001
      code_formula_preset: granite_docling
  ingestion:
    pipeline:
      max_concurrency: 16
  retrieval:
    top_k: 40
    chunk_top_k: 20
    direct_visual_top_k: 20

answer:
  runtime:
    answer_worker_concurrency: 16
    answer_run_retention_days: 365
  generation:
    max_images: 12
    max_attachments: 6
    max_attachment_bytes: 104857600
    max_total_attachment_bytes: 134217728
  agent:
    # disabled | trust | sandbox. Sandbox requires an installed trusted adapter.
    execution_environment: trust
    workspace_root: null
    # Explicit remote tools only; see docs/configuration.md for endpoint examples.
    outbound_mcp: []
    
observability:
  langfuse_host: http://host.docker.internal:3300
