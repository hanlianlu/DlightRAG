# DlightRAG 2.0 canonical configuration
# Priority: env > .env > config.yaml > defaults

models:
  # Optional deployment-specific model capability profiles. Empty falls
  # through to the built-in catalogue (and any PostgreSQL runtime overlay).
  catalogue: []
  chat:
    default:
      provider: openai
      model: z-ai/glm-5.3-flash
      base_url: https://openrouter.ai/api/v1
      temperature: 1.0
      reasoning: max
    roles:
      # DeepSeek rejects the json_schema response_format type, so every role on
      # it declares json_object explicitly. This is endpoint-specific, not the
      # shipped default: other endpoints keep the `auto` (strict schema) path.
      extract:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
      keyword:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
      query:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.7
        reasoning: off
        agentic_reasoning: max
        structured_output: json_object
      vlm:
        provider: openai
        model: deepseek-flash
        base_url: https://api.deepseek.com
        temperature: 0.0
        reasoning: off
        structured_output: json_object
  embedding:
    provider: voyage
    model: voyage-multimodal-3.5
    base_url: https://api.voyageai.com/v1
    dim: 1024
    input_modality: auto
    max_concurrency: 16
    batch_size: 64
  rerank:
    enabled: true
    strategy: voyage_reranker
    model: rerank-2.5-lite
    input_modality: auto
    max_concurrency: 16

deployment:
  # Relative to the process working directory. In the bundled image this
  # resolves to /app/dlightrag_storage, matching the Compose volume target.
  working_dir: ./dlightrag_storage
  # Default logical Corpus Workspace, not a Docker or Agent Workspace path.
  workspace: default

corpus:
  sidecars:
    mineru:
      api_mode: local
      local_endpoint: http://host.docker.internal:8210
      language: ch
      backend: hybrid-engine
    # Docling alternative: remove or comment out the MinerU block above before
    # uncommenting this block; configure exactly one ingestion parser.
    # docling:
    #   endpoint: http://host.docker.internal:5001
    #   code_formula_preset: granite_docling
    # For the bundled CPU profile, use endpoint http://docling:5001 and set
    # code_formula_preset to null instead.
  ingestion:
    pipeline:
      max_concurrency: 16
  retrieval:
    top_k: 40
    chunk_top_k: 20
    direct_visual_top_k: 20

runtime:
  query:
    worker_concurrency: 16
    max_nonterminal_runs: 30000
  # Validated bounded defaults; see docs/validation/run-runtime-slice-6.md.
  corpus_mutation:
    worker_concurrency: 2
    max_nonterminal_runs: 1000
  run_retention_days: 365

answer:
  generation:
    max_images: 12
    max_attachments: 6
    max_attachment_bytes: 104857600
    max_total_attachment_bytes: 134217728
  agent:
    # disabled | trust | sandbox. Sandbox requires an installed trusted adapter.
    execution_environment: trust
    # null uses ~/.dlightrag/agent_workspaces; Compose mounts its named volume at
    # that canonical container path instead of overriding this application value.
    workspace_root: null
    # Hide named packaged skills only; operator-global and owner overrides remain visible.
    disabled_builtin_skills: []
    # Personal Settings Connections (Streamable HTTP only). Policy only narrows
    # owner grants; keys belong exclusively in the existing secret source.
    connections:
      # Set the exact public callback URL to enable SDK OAuth authorization.
      # oauth_callback_url: https://app.example/web/oauth/connections/mcp/callback
      oauth_timeout: 300
      require_https: true
      allow_private_hosts: []
      max_connections: 20
      max_enabled_tools: 256
      max_tools: 128
      max_pages: 16
      max_schema_bytes: 32768
      max_description_bytes: 8192
      max_catalogue_bytes: 524288
      discovery_concurrency: 4
      refresh_seconds: 300
      discovery_timeout: 30
      call_timeout: 60
      call_concurrency: 8
      max_call_argument_bytes: 65536
      max_result_bytes: 262144
      max_result_parts: 32
      connect_timeout: 10
      idle_timeout: 15
      max_response_bytes: 1048576

access:
  # Product security policy belongs here. Compose only carries the explicit
  # local-loopback container waiver required by its 0.0.0.0 listener binding.
  # For simple or JWT auth, keep tokens/verification keys in .env or a Secret.
  auth_mode: none

observability:
  langfuse_host: http://host.docker.internal:3300
