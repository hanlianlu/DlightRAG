name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make sync-dev
      - run: make lint
      - run: make lint-security
      - run: make format-check
      - run: make typecheck
      - run: make architecture-check
      - run: make shellcheck-all
      - run: make frontend-install
      - run: make frontend-typecheck
      - run: make frontend-lint
      - run: make frontend-build
      - run: make frontend-audit
      - run: make test-unit

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/dlightrag-postgres:pg18
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: dlightrag
          POSTGRES_USER: dlightrag
          POSTGRES_PASSWORD: dlightrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlightrag -d dlightrag"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run pytest tests/integration -q --tb=short
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: dlightrag
          PGPASSWORD: dlightrag
          PGDATABASE: dlightrag
