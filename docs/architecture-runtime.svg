<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">DlightRAG runtime ownership</title>
  <desc id="description">Inside one DlightRAG process, inbound HTTP and MCP adapters call Application use cases. Answer Runs use durable Runtime and Engine Answer; Retrieval and Corpus Administration use Engine RAG; Memory uses the independent Memory package. Engine Answer, Agent, and RAG call provider-neutral AI. RAG reaches the external LightRAG package. Import direction matches this ownership and is machine-enforced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #ffffff; }
      .boundary { fill: #f8fafc; stroke: #8a98ac; stroke-width: 1.5; }
      .heading { fill: #172033; font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subtitle, .note { fill: #526076; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .boundary-title { fill: #35445a; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
      .node-title { fill: #172033; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .node-copy { fill: #35445a; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge-label { fill: #526076; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .interface { fill: #eef4ff; stroke: #4f79bd; stroke-width: 1.5; }
      .service { fill: #e8f5ee; stroke: #3f8060; stroke-width: 1.5; }
      .module { fill: #f3efff; stroke: #7655aa; stroke-width: 1.5; }
      .foundation { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .external { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .badge { fill: #ffffff; stroke: #8a98ac; stroke-width: 1; }
      .edge { fill: none; stroke: #46566d; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-head { fill: #46566d; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .boundary { fill: #111821; stroke: #59677a; }
        .heading, .node-title { fill: #f0f4fa; }
        .subtitle, .note, .edge-label { fill: #aeb9ca; }
        .boundary-title, .node-copy { fill: #d2d9e5; }
        .interface { fill: #17243a; stroke: #78a5e8; }
        .service { fill: #14271d; stroke: #62a77f; }
        .module { fill: #221b31; stroke: #a88ad4; }
        .foundation { fill: #2c2518; stroke: #d2a24b; }
        .external { fill: #2c2518; stroke: #d2a24b; }
        .badge { fill: #151b24; stroke: #59677a; }
        .edge { stroke: #aeb9ca; }
        .arrow-head { fill: #aeb9ca; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1400" height="900"/>
  <text class="heading" x="700" y="42" text-anchor="middle">DlightRAG — Runtime Ownership</text>
  <text class="subtitle" x="700" y="70" text-anchor="middle">In-process ownership; import direction matches these owners and is machine-enforced</text>

  <rect class="boundary" x="50" y="100" width="1300" height="750" rx="22"/>
  <text class="boundary-title" x="85" y="134">DLIGHTRAG APPLICATION PROCESS</text>
  <rect class="badge" x="925" y="114" width="380" height="42" rx="10"/>
  <text class="note" x="1115" y="140" text-anchor="middle">Application owns use cases; composition is private</text>

  <rect class="interface" x="110" y="180" width="540" height="100" rx="14"/>
  <text class="node-title" x="380" y="219" text-anchor="middle">Inbound adapters</text>
  <text class="node-copy" x="380" y="249" text-anchor="middle">adapters.http · adapters.mcp</text>

  <rect class="interface" x="750" y="180" width="540" height="100" rx="14"/>
  <text class="node-title" x="1020" y="219" text-anchor="middle">Embedded interface</text>
  <text class="node-copy" x="1020" y="249" text-anchor="middle">Python Application interface</text>

  <rect class="service" x="180" y="330" width="1040" height="100" rx="16"/>
  <text class="node-title" x="700" y="370" text-anchor="middle">Application use cases</text>
  <text class="node-copy" x="700" y="400" text-anchor="middle">Answer Runs · Retrieval · Corpus Administration · Memory · Health</text>

  <rect class="module" x="90" y="500" width="250" height="110" rx="14"/>
  <text class="node-title" x="215" y="540" text-anchor="middle">engine.runtime</text>
  <text class="node-copy" x="215" y="570" text-anchor="middle">RunCoordinator · leases</text>
  <text class="node-copy" x="215" y="593" text-anchor="middle">fencing · events</text>

  <rect class="module" x="390" y="500" width="250" height="110" rx="14"/>
  <text class="node-title" x="515" y="540" text-anchor="middle">engine.answer</text>
  <text class="node-copy" x="515" y="570" text-anchor="middle">owns Fast and Research policy</text>
  <text class="node-copy" x="515" y="593" text-anchor="middle">evidence · citations · Memory</text>

  <rect class="module" x="700" y="500" width="250" height="110" rx="14"/>
  <text class="node-title" x="825" y="540" text-anchor="middle">engine.rag</text>
  <text class="node-copy" x="825" y="570" text-anchor="middle">WorkspacePool · WorkspaceRag</text>
  <text class="node-copy" x="825" y="593" text-anchor="middle">LightRAG integration</text>

  <rect class="module" x="1010" y="500" width="250" height="110" rx="14"/>
  <text class="node-title" x="1135" y="540" text-anchor="middle">Owner Memory</text>
  <text class="node-copy" x="1135" y="570" text-anchor="middle">Host policy and Answer recall</text>
  <text class="node-copy" x="1135" y="593" text-anchor="middle">over dlightrag-memory</text>

  <rect class="foundation" x="200" y="700" width="220" height="90" rx="14"/>
  <text class="node-title" x="310" y="736" text-anchor="middle">engine.agent</text>
  <text class="node-copy" x="310" y="766" text-anchor="middle">product-neutral Session kernel</text>

  <rect class="foundation" x="490" y="700" width="240" height="90" rx="14"/>
  <text class="node-title" x="610" y="736" text-anchor="middle">engine.ai</text>
  <text class="node-copy" x="610" y="766" text-anchor="middle">Model lifecycles and provider adapters</text>

  <rect class="external" x="800" y="700" width="240" height="90" rx="14"/>
  <text class="node-title" x="920" y="736" text-anchor="middle">LightRAG</text>
  <text class="node-copy" x="920" y="766" text-anchor="middle">external RAG package</text>

  <path class="edge" d="M 380 280 V 330"/>
  <text class="edge-label" x="395" y="312">calls</text>
  <path class="edge" d="M 1020 280 V 330"/>
  <text class="edge-label" x="1035" y="312">calls</text>

  <path class="edge" d="M 215 430 V 500"/>
  <text class="edge-label" x="230" y="470">durable answers</text>
  <path class="edge" d="M 825 430 V 500"/>
  <text class="edge-label" x="840" y="470">retrieve / ingest</text>
  <path class="edge" d="M 1135 430 V 500"/>
  <text class="edge-label" x="1150" y="470">owner operations</text>

  <path class="edge" d="M 340 555 H 390"/>
  <path class="edge" d="M 640 575 H 700"/>

  <path class="edge" d="M 450 610 V 660 H 310 V 700"/>
  <text class="edge-label" x="330" y="681">invokes</text>
  <path class="edge" d="M 515 610 V 700"/>
  <text class="edge-label" x="530" y="660">model calls</text>
  <path class="edge" d="M 825 610 V 640 H 610 V 700"/>
  <text class="edge-label" x="720" y="632">model calls</text>
  <path class="edge" d="M 875 610 V 660 H 920 V 700"/>
  <text class="edge-label" x="930" y="645">uses</text>
  <path class="edge" d="M 420 745 H 490"/>
  <text class="edge-label" x="455" y="731" text-anchor="middle">uses</text>

  <text class="note" x="700" y="825" text-anchor="middle">Concrete persistence is reached through owner-defined ports; see the Deployment view. Import contracts live in Code Layering.</text>
</svg>
