<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">DlightRAG deployment and storage topology</title>
  <desc id="description">Writer and reader DlightRAG processes share one PostgreSQL 18 primary and the same corpus artifact directory. Both process roles execute durable answers and write operational state; only the writer mutates corpus state and owns migrations. External AI, parser, and optional tool endpoints are separate runtimes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #ffffff; }
      .heading { fill: #172033; font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subtitle, .note { fill: #526076; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .group-title { fill: #35445a; font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
      .node-title { fill: #172033; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .node-copy { fill: #35445a; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge-label { fill: #526076; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .process-group { fill: #f8fafc; stroke: #8a98ac; stroke-width: 1.5; }
      .process { fill: #eef4ff; stroke: #4f79bd; stroke-width: 1.5; }
      .external { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .store { fill: #edf8f1; stroke: #3f8060; stroke-width: 1.5; }
      .divider { stroke: #8db39b; stroke-width: 1; }
      .external-divider { stroke: #c79b4e; stroke-width: 1; }
      .edge { fill: none; stroke: #46566d; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-head { fill: #46566d; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .heading, .node-title { fill: #f0f4fa; }
        .subtitle, .note, .edge-label { fill: #aeb9ca; }
        .group-title, .node-copy { fill: #d2d9e5; }
        .process-group { fill: #111821; stroke: #59677a; }
        .process { fill: #17243a; stroke: #78a5e8; }
        .external { fill: #2c2518; stroke: #d2a24b; }
        .store { fill: #14271d; stroke: #62a77f; }
        .divider { stroke: #456c55; }
        .external-divider { stroke: #8f6f31; }
        .edge { stroke: #aeb9ca; }
        .arrow-head { fill: #aeb9ca; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="720"/>
  <text class="heading" x="640" y="42" text-anchor="middle">DlightRAG — Deployment and Storage</text>
  <text class="subtitle" x="640" y="70" text-anchor="middle">Process roles, shared state, and external runtimes</text>

  <rect class="process-group" x="60" y="120" width="730" height="300" rx="20"/>
  <text class="group-title" x="90" y="154">DLIGHTRAG SERVICE PROCESSES</text>

  <rect class="process" x="100" y="185" width="300" height="175" rx="14"/>
  <text class="node-title" x="250" y="225" text-anchor="middle">Writer role</text>
  <text class="node-copy" x="250" y="260" text-anchor="middle">Answers and operational writes</text>
  <text class="node-copy" x="250" y="286" text-anchor="middle">Corpus mutation and ingestion</text>
  <text class="node-copy" x="250" y="312" text-anchor="middle">Schema migration owner</text>

  <rect class="process" x="450" y="185" width="300" height="175" rx="14"/>
  <text class="node-title" x="600" y="225" text-anchor="middle">Reader role</text>
  <text class="node-copy" x="600" y="260" text-anchor="middle">Answers and operational writes</text>
  <text class="node-copy" x="600" y="286" text-anchor="middle">Corpus reads only</text>
  <text class="node-copy" x="600" y="312" text-anchor="middle">No corpus administration</text>

  <rect class="external" x="860" y="120" width="350" height="300" rx="20"/>
  <text class="group-title" x="890" y="154">EXTERNAL RUNTIMES</text>
  <text class="node-title" x="1035" y="214" text-anchor="middle">AI provider endpoints</text>
  <text class="node-copy" x="1035" y="243" text-anchor="middle">Chat · VLM · embedding · rerank</text>
  <line class="external-divider" x1="910" y1="270" x2="1160" y2="270"/>
  <text class="node-title" x="1035" y="312" text-anchor="middle">Parser sidecars</text>
  <text class="node-copy" x="1035" y="341" text-anchor="middle">MinerU · Docling</text>
  <text class="node-copy" x="1035" y="376" text-anchor="middle">Optional Exa and outbound MCP</text>

  <rect class="store" x="60" y="500" width="730" height="160" rx="18"/>
  <text class="node-title" x="425" y="536" text-anchor="middle">PostgreSQL 18 primary</text>
  <line class="divider" x1="303" y1="553" x2="303" y2="640"/>
  <line class="divider" x1="547" y1="553" x2="547" y2="640"/>
  <text class="node-title" x="181" y="580" text-anchor="middle">Operational state</text>
  <text class="node-copy" x="181" y="608" text-anchor="middle">runs · events · Web</text>
  <text class="node-copy" x="181" y="631" text-anchor="middle">both roles write</text>
  <text class="node-title" x="425" y="580" text-anchor="middle">Corpus state</text>
  <text class="node-copy" x="425" y="608" text-anchor="middle">graph · vector · BM25</text>
  <text class="node-copy" x="425" y="631" text-anchor="middle">writer mutates</text>
  <text class="node-title" x="668" y="580" text-anchor="middle">Memory schema</text>
  <text class="node-copy" x="668" y="608" text-anchor="middle">owner records</text>
  <text class="node-copy" x="668" y="631" text-anchor="middle">package-owned migration</text>

  <rect class="store" x="860" y="500" width="350" height="160" rx="18"/>
  <text class="node-title" x="1035" y="550" text-anchor="middle">Shared corpus artifacts</text>
  <text class="node-copy" x="1035" y="585" text-anchor="middle">Same absolute working_dir</text>
  <text class="node-copy" x="1035" y="611" text-anchor="middle">mounted by every process</text>
  <text class="node-copy" x="1035" y="637" text-anchor="middle">Sources · parser output · visuals</text>

  <path class="edge" d="M 250 360 V 500"/>
  <text class="edge-label" x="265" y="462">SQL · leases</text>
  <path class="edge" d="M 600 360 V 500"/>
  <text class="edge-label" x="585" y="462" text-anchor="end">SQL · leases</text>
  <path class="edge" d="M 650 420 V 460 H 1035 V 500"/>
  <text class="edge-label" x="825" y="449" text-anchor="middle">shared filesystem</text>
  <path class="edge" d="M 790 270 H 860"/>
  <text class="edge-label" x="825" y="256" text-anchor="middle">calls</text>

  <text class="note" x="640" y="700" text-anchor="middle">Reader means corpus-read-only, not process-read-only; both roles use the same primary endpoint.</text>
</svg>
