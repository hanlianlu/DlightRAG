<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">DlightRAG compile-time module dependencies</title>
  <desc id="description">Inbound HTTP and MCP adapters import Application, not Engine. Application may import Engine Answer, RAG, Runtime, and Memory. Engine Answer may import AI, Agent, RAG, and Runtime. Agent may import AI. RAG may import AI and the external LightRAG package. Runtime and Memory remain independent of Answer policy and storage implementations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #ffffff; }
      .heading { fill: #172033; font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subtitle, .note { fill: #526076; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .node-title { fill: #172033; font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .node-copy { fill: #35445a; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge-label { fill: #526076; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .product { fill: #e8f5ee; stroke: #3f8060; stroke-width: 1.5; }
      .module { fill: #eef4ff; stroke: #4f79bd; stroke-width: 1.5; }
      .memory { fill: #f3efff; stroke: #7655aa; stroke-width: 1.5; }
      .external { fill: #fff7e6; stroke: #b7791f; stroke-width: 1.5; }
      .edge { fill: none; stroke: #46566d; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-head { fill: #46566d; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
        .heading, .node-title { fill: #f0f4fa; }
        .subtitle, .note, .edge-label { fill: #aeb9ca; }
        .node-copy { fill: #d2d9e5; }
        .product { fill: #14271d; stroke: #62a77f; }
        .module { fill: #17243a; stroke: #78a5e8; }
        .memory { fill: #221b31; stroke: #a88ad4; }
        .external { fill: #2c2518; stroke: #d2a24b; }
        .edge { stroke: #aeb9ca; }
        .arrow-head { fill: #aeb9ca; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="720"/>
  <text class="heading" x="640" y="42" text-anchor="middle">DlightRAG — Compile-time Dependencies</text>
  <text class="subtitle" x="640" y="70" text-anchor="middle">Every arrow means “may import”; runtime calls and deployment connections are excluded</text>

  <rect class="product" x="80" y="105" width="1120" height="110" rx="18"/>
  <text class="node-title" x="640" y="145" text-anchor="middle">Application and Adapters</text>
  <text class="node-copy" x="640" y="175" text-anchor="middle">application use cases · adapters.http · adapters.mcp · PostgreSQL and Observability</text>
  <text class="node-copy" x="640" y="198" text-anchor="middle">Inbound HTTP and MCP call Application; private composition wires adapters.</text>

  <rect class="module" x="450" y="265" width="380" height="100" rx="14"/>
  <text class="node-title" x="640" y="304" text-anchor="middle">dlightrag.engine.answer</text>
  <text class="node-copy" x="640" y="334" text-anchor="middle">execution · orchestration · Fast · Research</text>

  <rect class="module" x="70" y="440" width="200" height="100" rx="14"/>
  <text class="node-title" x="170" y="478" text-anchor="middle">dlightrag.engine.agent</text>
  <text class="node-copy" x="170" y="508" text-anchor="middle">Session kernel + tool contracts</text>

  <rect class="module" x="340" y="440" width="200" height="100" rx="14"/>
  <text class="node-title" x="440" y="478" text-anchor="middle">dlightrag.engine.rag</text>
  <text class="node-copy" x="440" y="508" text-anchor="middle">workspace · corpus · retrieval</text>

  <rect class="module" x="710" y="440" width="200" height="100" rx="14"/>
  <text class="node-title" x="810" y="478" text-anchor="middle">dlightrag.engine.runtime</text>
  <text class="node-copy" x="810" y="508" text-anchor="middle">durable, storage-neutral lifecycle</text>

  <rect class="memory" x="980" y="440" width="200" height="100" rx="14"/>
  <text class="node-title" x="1080" y="478" text-anchor="middle">dlightrag-memory</text>
  <text class="node-copy" x="1080" y="508" text-anchor="middle">independent, host-neutral wheel</text>

  <rect class="module" x="220" y="625" width="220" height="80" rx="14"/>
  <text class="node-title" x="330" y="658" text-anchor="middle">dlightrag.engine.ai</text>
  <text class="node-copy" x="330" y="685" text-anchor="middle">provider-neutral lifecycle</text>

  <rect class="external" x="520" y="625" width="200" height="80" rx="14"/>
  <text class="node-title" x="620" y="658" text-anchor="middle">LightRAG</text>
  <text class="node-copy" x="620" y="685" text-anchor="middle">external package</text>

  <path class="edge" d="M 640 215 V 265"/>
  <path class="edge" d="M 210 215 V 420 H 170 V 440"/>
  <path class="edge" d="M 390 215 V 440"/>
  <path class="edge" d="M 860 215 V 440"/>
  <path class="edge" d="M 1080 215 V 440"/>

  <path class="edge" d="M 520 365 V 400 H 170 V 440"/>
  <path class="edge" d="M 590 365 V 410 H 440 V 440"/>
  <path class="edge" d="M 700 365 V 410 H 810 V 440"/>
  <path class="edge" d="M 760 365 V 400 H 1080 V 440"/>
  <path class="edge" d="M 550 365 V 590 H 400 V 625"/>
  <text class="edge-label" x="420" y="584">uses AI</text>

  <path class="edge" d="M 170 540 V 590 H 280 V 625"/>
  <path class="edge" d="M 400 540 V 625"/>
  <path class="edge" d="M 480 540 V 590 H 620 V 625"/>

  <text class="note" x="910" y="685" text-anchor="middle">Import-linter enforces the landed direction; M7 is the docs/closure audit.</text>
</svg>
