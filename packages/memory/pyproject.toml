[project]
name = "dlightrag-memory"
version = "2.0.4"
description = "Reusable cross-conversation profile memory for DlightRAG"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    "asyncpg>=0.31.0",
    "mcp>=2.0.0",
    "pydantic>=2.11.0",
]

[project.scripts]
dlightrag-memory-mcp = "dlightrag_memory.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag_memory"]
