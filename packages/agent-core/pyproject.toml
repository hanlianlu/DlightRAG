[project]
name = "dlightrag-agent-core"
version = "1.9.0"
description = "Reusable agent mechanics for DlightRAG"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    "dlightrag-ai==1.9.0",
    "pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag_agent"]

[tool.uv.sources]
dlightrag-ai = { workspace = true }
