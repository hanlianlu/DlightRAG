[project]
name = "dlightrag-rag-core"
version = "1.9.0"
description = "Storage-neutral RAG capabilities for DlightRAG"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = ["pydantic>=2.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag_rag"]
