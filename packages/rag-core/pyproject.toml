[project]
name = "dlightrag-rag-core"
version = "1.9.0"
description = "Storage-neutral RAG capabilities for DlightRAG"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
	"dlightrag-ai==1.9.0",
	"lightrag-hku>=1.5.6",
	"numpy>=2.3.0",
	"pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag_rag"]

[tool.uv.sources]
dlightrag-ai = { workspace = true }
