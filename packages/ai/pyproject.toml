[project]
name = "dlightrag-ai"
version = "1.9.0"
description = "Provider-neutral AI primitives for DlightRAG"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    "httpx>=0.28.1",
    "json-repair>=0.62.0",
    "pillow>=12.3.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
openai = ["openai>=2.53.0"]
anthropic = ["anthropic>=0.121.0"]
gemini = ["google-genai>=2.17.0"]
all = [
    "openai>=2.53.0",
    "anthropic>=0.121.0",
    "google-genai>=2.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlightrag_ai"]
