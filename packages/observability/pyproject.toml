[project]
name = "dlightrag-observability"
version = "3.0.0"
description = "The privacy classifier, the OTLP export, and the ClickStack stack for DlightRAG"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    # The transport this package owns. The application depends on the package and
    # never imports these directly.
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=0.66b1",
    # The registry the constants in `otlp.py` and the SQL the stack ships are verified
    # against, declared here rather than left to the SDK's own pin: the GenAI attributes
    # are still incubating — `opentelemetry.semconv.attributes` carries no
    # `gen_ai_attributes` — so the tests read `semconv._incubating`, and the version that
    # defines those names is this package's dependency to keep.
    "opentelemetry-semantic-conventions>=0.66b1",
]

[project.scripts]
dlightrag-observability = "dlightrag_observability.cli:main"

[build-system]
# Forward-only policy: CI verifies new backend releases; do not add an upper bound.
requires = ["uv_build>=0.11.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["compose.yaml", "stack/**"]
source-exclude = ["**/.DS_Store", "stack/.env"]
